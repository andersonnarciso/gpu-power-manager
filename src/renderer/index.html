  <head>

      Strict Content Security Policy.
      Everything the renderer loads is bundled locally: no CDN, no remote font,
      no external image. `style-src 'unsafe-inline'` is required because Radix
      primitives and Recharts set element styles at runtime.
    -->

      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'"
